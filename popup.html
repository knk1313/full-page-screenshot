<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ページ全体をスクショ</title>
  <style>
    /*
     * デジタル庁デザインシステム（DADS）のトークンに合わせた見た目。
     * 値は knk1313/workspace-ui-template-dads の src/tokens/ から取っている。
     */
    :root {
      color-scheme: light dark;

      /* 面・文字・線 */
      --color-canvas: #f2f2f2;          /* solid-gray-50 */
      --color-surface: #ffffff;         /* white */
      --color-text: #333333;            /* solid-gray-800 */
      --color-text-strong: #1a1a1a;     /* solid-gray-900 */
      --color-text-muted: #666666;      /* solid-gray-600 */
      --color-border: #949494;          /* solid-gray-420 */
      --color-border-on-canvas: #767676;/* solid-gray-536 */

      /* プライマリー（キーカラー） */
      --color-primary: #0017c1;         /* key-900 */
      --color-primary-hover: #00118f;   /* key-1000 */
      --color-primary-active: #000060;  /* key-1200 */
      --color-text-on-primary: #ffffff;
      --color-primary-outline-hover: #c5d7fb;  /* key-200 */
      --color-primary-outline-active: #9db7f9; /* key-300 */

      /* 意味色・無効 */
      --color-success: #197a4b;         /* success-2 */
      --color-error: #ce0000;           /* red-900 */
      --color-disabled: #b3b3b3;        /* solid-gray-300 */
      --color-on-disabled: #f2f2f2;     /* solid-gray-50 */

      /* フォーカス（黒 4px + 黄 2px。DADS の決まりで変えない） */
      --color-focus: #000000;
      --color-focus-ring: #ffd43d;      /* yellow-300 */

      /* 角丸・影 */
      --radius-4: 4px;
      --radius-12: 12px;
      --radius-16: 16px;
      --shadow-1: 0 2px 8px 1px rgba(0, 0, 0, 0.1), 0 1px 5px 0 rgba(0, 0, 0, 0.3);

      --font-sans: "Noto Sans JP Variable", "Noto Sans JP", -apple-system, BlinkMacSystemFont,
        "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      --font-mono: "Noto Sans Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* ダークモード（workspace-ui-template-dads の theme-dark.css と同じ配色） */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-canvas: #000000;
        --color-surface: #1a1a1a;
        --color-text: #f2f2f2;
        --color-text-strong: #ffffff;
        --color-text-muted: #b3b3b3;
        --color-border: #767676;
        --color-border-on-canvas: #767676;

        --color-primary: #9db7f9;        /* blue-300 */
        --color-primary-hover: #c5d7fb;  /* blue-200 */
        --color-primary-active: #d9e6ff; /* blue-100 */
        --color-text-on-primary: #000000;
        --color-primary-outline-hover: #000071;  /* blue-1100 */
        --color-primary-outline-active: #00118f; /* blue-1000 */

        --color-success: #71c598;        /* green-300 */
        --color-error: #ff9696;          /* red-300 */
        --color-disabled: #4d4d4d;       /* solid-gray-700 */
        --color-on-disabled: #949494;    /* solid-gray-420 */

        --color-focus: #ffd43d;
        --color-focus-ring: #000000;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 312px;
      padding: 0;
      /* メニューの窓は Chrome が描き、透明にできない。窓そのものを面の色にして、1枚のモーダルに見せる */
      background: var(--color-surface);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.7;
    }

    .card {
      padding: 20px 16px 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 4px;
    }
    .header svg { flex: none; width: 24px; height: 24px; color: var(--color-primary); }
    h1 {
      margin: 0;
      color: var(--color-text-strong);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
    }
    .lead {
      margin: 0 0 16px;
      color: var(--color-text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .actions { display: flex; flex-direction: column; gap: 8px; }

    /* DADS ボタン（size md：高さ 48px）。角丸は 12px にしている */
    button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      padding: 8px 16px;
      border-radius: var(--radius-12);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      text-align: left;
      white-space: nowrap;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    /* 塗り（プライマリー）：二重線の透明な枠で、強制カラーモードでも境界が出るようにする */
    .solid {
      border: 4px double transparent;
      background: var(--color-primary);
      color: var(--color-text-on-primary);
    }
    .solid:hover { background: var(--color-primary-hover); text-decoration: underline 1px; }
    .solid:active { background: var(--color-primary-active); text-decoration: underline; }

    /* 枠線（セカンダリー） */
    .outline {
      border: 1px solid currentColor;
      background: var(--color-surface);
      color: var(--color-primary);
    }
    .outline:hover {
      background: var(--color-primary-outline-hover);
      color: var(--color-primary-hover);
      text-decoration: underline 1px;
    }
    .outline:active {
      background: var(--color-primary-outline-active);
      color: var(--color-primary-active);
      text-decoration: underline;
    }

    button:focus-visible {
      outline: 4px solid var(--color-focus);
      outline-offset: 2px;
      box-shadow: 0 0 0 2px var(--color-focus-ring);
    }

    button:disabled { cursor: default; text-decoration: none; }
    .solid:disabled { background: var(--color-disabled); color: var(--color-on-disabled); }
    .outline:disabled { background: var(--color-surface); color: var(--color-disabled); }

    /* キーの案内 */
    kbd {
      flex: none;
      min-width: 24px;
      padding: 3px 6px;
      border: 1px solid currentColor;
      border-radius: var(--radius-4);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 400;
      line-height: 1;
      text-align: center;
      opacity: 0.85;
    }

    /* 状態の表示 */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 21px;
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .status:empty { display: none; }
    .status.done { color: var(--color-success); font-weight: 700; }
    .status.error { color: var(--color-error); font-weight: 700; }
    .status.busy::before {
      content: "";
      flex: none;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .status.busy::before { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd"
          d="M9 3.5h6a1.5 1.5 0 0 1 1.4 1L17 6h2.5A2.5 2.5 0 0 1 22 8.5v10a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 18.5v-10A2.5 2.5 0 0 1 4.5 6H7l.6-1.5a1.5 1.5 0 0 1 1.4-1ZM12 9a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/>
      </svg>
      <h1>ページ全体をスクショ</h1>
    </div>
    <p class="lead">上から下までを1枚の画像にします</p>

    <div class="actions">
      <button id="copy" class="solid" type="button">クリップボードにコピー<kbd>C</kbd></button>
      <button id="save" class="outline" type="button">PNGで保存<kbd>S</kbd></button>
      <button id="both" class="outline" type="button">コピーして保存<kbd>B</kbd></button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
